name: Build Backend

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ui_version:
        description: "Frontend UI version tag (e.g. ui-v1.3.0). Overrides UI_VERSION file."
        required: false
        default: ""

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # required to create releases and download release assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build backend executable
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ github.event.inputs.ui_version }}" -ne "") {
            ./scripts/build.ps1 -UiVersion "${{ github.event.inputs.ui_version }}" -FrontendRepo "HEMANTRAI233/healthchecker-ui"
          } else {
            ./scripts/build.ps1 -FrontendRepo "HEMANTRAI233/healthchecker-ui"
          }

      - name: Build Windows executable
        shell: pwsh
        run: Get-Item ./build/healthchecker.exe

      - name: Package install scripts
        shell: pwsh
        run: Compress-Archive -Path ./scripts/* -DestinationPath ./build/windows-install-scripts.zip -Force

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: healthchecker-windows-amd64
          path: |
            build/healthchecker.exe
            build/windows-install-scripts.zip
            UI_VERSION
          if-no-files-found: error

      - name: Create GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $uiVersion = (Get-Content ./UI_VERSION -Raw).Trim()
          if ("${{ github.event.inputs.ui_version }}" -ne "") {
            $uiVersion = "${{ github.event.inputs.ui_version }}"
          }
          $shortSha = "${{ github.sha }}".Substring(0,7)
          $tag = "backend-$shortSha"
          $title = "Backend build $shortSha (UI: $uiVersion)"

          gh release create $tag ./build/healthchecker.exe ./build/windows-install-scripts.zip `
            --title $title `
            --notes "Automated backend release. Embeds frontend $uiVersion." `
            --latest
