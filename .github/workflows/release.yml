name: Automated Release Pipeline

on:

 repository_dispatch:
   types:
     - ui_release

jobs:

 build-windows:

   runs-on: windows-latest

   steps:

     # -----------------------------------
     # CHECKOUT CODE
     # -----------------------------------

     - name: Checkout Repository
       uses: actions/checkout@v4

     # -----------------------------------
     # SETUP GO
     # -----------------------------------

     - name: Setup Go
       uses: actions/setup-go@v5
       with:
         go-version: '1.24'

     # -----------------------------------
     # VERIFY EVENT
     # -----------------------------------

     - name: Verify Trigger
       shell: powershell
       run: |

         Write-Host ""
         Write-Host "================================="
         Write-Host "BACKEND PIPELINE TRIGGERED"
         Write-Host "================================="
         Write-Host ""

         Write-Host "UI Version Received:"
         Write-Host "${{ github.event.client_payload.ui_version }}"

     # -----------------------------------
     # BUILD APPLICATION
     # -----------------------------------

     - name: Build Windows Application
       shell: powershell
       run: |

         ./scripts/build.ps1 `
           -UiVersion "${{ github.event.client_payload.ui_version }}" `
           -TargetPlatform "windows"

       env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

     # -----------------------------------
     # INSTALL INNO SETUP
     # -----------------------------------

     - name: Install Inno Setup
       run: |

         choco install innosetup -y

     # -----------------------------------
     # BUILD WINDOWS INSTALLER
     # -----------------------------------

     - name: Build Windows Installer
       shell: powershell
       run: |

         & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
           "deployments/windows/installer.iss"

     # -----------------------------------
     # VERIFY WINDOWS INSTALLER EXISTS
     # -----------------------------------

     - name: Verify Windows Installer
       shell: powershell
       run: |

         if (!(Test-Path "HealthChecker-Setup.exe")) {

             throw "Windows installer not generated"
         }

         Write-Host ""
         Write-Host "[OK] Windows installer generated successfully"

     # -----------------------------------
     # UPLOAD WINDOWS INSTALLER ARTIFACT
     # -----------------------------------

     - name: Upload Windows Installer
       uses: actions/upload-artifact@v4
       with:
         name: HealthChecker-Windows-Setup-${{ github.sha }}
         path: HealthChecker-Setup.exe

 build-linux:

   runs-on: ubuntu-latest

   steps:

     # -----------------------------------
     # CHECKOUT CODE
     # -----------------------------------

     - name: Checkout Repository
       uses: actions/checkout@v4

     # -----------------------------------
     # SETUP GO
     # -----------------------------------

     - name: Setup Go
       uses: actions/setup-go@v5
       with:
         go-version: '1.24'

     # -----------------------------------
     # SETUP PWSH (for PowerShell on Linux)
     # -----------------------------------

     - name: Setup PowerShell
       shell: bash
       run: |

         sudo apt-get update
         sudo apt-get install -y powershell

     # -----------------------------------
     # BUILD LINUX APPLICATION
     # -----------------------------------

     - name: Build Linux Application
       shell: pwsh
       run: |

         ./scripts/build.ps1 `
           -UiVersion "${{ github.event.client_payload.ui_version }}" `
           -TargetPlatform "linux"

       env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

     # -----------------------------------
     # VERIFY LINUX INSTALLER BUNDLE EXISTS
     # -----------------------------------

     - name: Verify Linux Installer Bundle
       shell: pwsh
       run: |

         if (!(Test-Path "HealthChecker-Linux-Installer.tar.gz") -and !(Test-Path "HealthChecker-Linux-Installer.zip")) {

             throw "Linux installer bundle not generated"
         }

         Write-Host ""
         Write-Host "[OK] Linux installer bundle generated successfully"

     # -----------------------------------
     # UPLOAD LINUX INSTALLER ARTIFACT
     # -----------------------------------

     - name: Upload Linux Installer Bundle
       uses: actions/upload-artifact@v4
       with:
         name: HealthChecker-Linux-Installer-${{ github.sha }}
         path: |
           HealthChecker-Linux-Installer.tar.gz
           HealthChecker-Linux-Installer.zip
         if-no-files-found: warn