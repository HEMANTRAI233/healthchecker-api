name: Build Backend

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ui_version:
        description: "Frontend UI version tag (e.g. ui-v1.3.0). Overrides UI_VERSION file."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # Determine which frontend release tag to consume                     #
      # ------------------------------------------------------------------ #
      - name: Resolve UI version
        id: ui_version
        run: |
          if [ -n "${{ github.event.inputs.ui_version }}" ]; then
            VERSION="${{ github.event.inputs.ui_version }}"
          elif [ -f UI_VERSION ]; then
            VERSION="$(tr -d '[:space:]' < UI_VERSION)"
          else
            VERSION="latest"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved UI version: ${VERSION}"

      # ------------------------------------------------------------------ #
      # Download & extract the React build artifact from the frontend repo  #
      # The frontend CI must publish a release asset named dist.zip         #
      # ------------------------------------------------------------------ #
      - name: Download frontend artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UI_VERSION="${{ steps.ui_version.outputs.version }}"
          # TODO: replace with the actual frontend repository slug
          FRONTEND_REPO="HEMANTRAI233/healthchecker-ui"

          mkdir -p /tmp/ui-artifact ui/dist

          if [ "$UI_VERSION" = "latest" ]; then
            gh release download \
              --repo "$FRONTEND_REPO" \
              --pattern "dist.zip" \
              --dir /tmp/ui-artifact
          else
            gh release download "$UI_VERSION" \
              --repo "$FRONTEND_REPO" \
              --pattern "dist.zip" \
              --dir /tmp/ui-artifact
          fi

          # Extract into ui/dist/, overwriting the placeholder index.html
          unzip -o /tmp/ui-artifact/dist.zip -d ui/dist/
          echo "Frontend artifact extracted"

      # ------------------------------------------------------------------ #
      # Set up Go                                                           #
      # ------------------------------------------------------------------ #
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # ------------------------------------------------------------------ #
      # Build the Windows executable (single .exe, UI + API embedded)      #
      # ------------------------------------------------------------------ #
      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w" -o healthchecker.exe .
          echo "Build complete: $(du -sh healthchecker.exe)"

      # ------------------------------------------------------------------ #
      # Upload the .exe as a workflow artifact                              #
      # ------------------------------------------------------------------ #
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: healthchecker-windows-amd64
          path: healthchecker.exe
          if-no-files-found: error

      # ------------------------------------------------------------------ #
      # Create a GitHub release when the build is triggered from main      #
      # ------------------------------------------------------------------ #
      - name: Create GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UI_VERSION="${{ steps.ui_version.outputs.version }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="backend-${SHORT_SHA}"
          TITLE="Backend build ${SHORT_SHA} (UI: ${UI_VERSION})"

          gh release create "$TAG" healthchecker.exe \
            --title "$TITLE" \
            --notes "Automated backend release. Embeds frontend ${UI_VERSION}." \
            --latest
